<svg width="1000" height="500" viewBox="0 0 1000 500"
xmlns="http://www.w3.org/2000/svg">

<rect width="1000" height="500" fill="#0d1117"/>

<style>
.title {
  fill: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 18px;
  font-weight: bold;
}

.label {
  fill: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

.grid {
  fill: none;
  stroke: #30363d;
  stroke-width: 1;
}

.axis {
  stroke: #30363d;
  stroke-width: 1;
}

.radar {
  fill: #238636;
  fill-opacity: 0.35;
  stroke: #39d353;
  stroke-width: 3;
}

.point {
  fill: #39d353;
}
</style>


